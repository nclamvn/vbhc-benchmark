# M7b (QĐ-16): tiếp từ bản v5 trên tập v6 (tư liệu luôn chứa căn cứ thật ở 70% bài T1), khoảng 0,7 lượt dữ liệu. LR khởi động 50 vòng rồi cosine 1e-5 → 1e-6.
lora_parameters:
  rank: 16
  dropout: 0.05
  scale: 20.0
lr_schedule:
  name: cosine_decay
  warmup: 50
  warmup_init: 1.0e-7
  arguments: [1.0e-5, 800, 1.0e-6]
